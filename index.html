<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Games</title>
  <meta name="description" content="Lista de jogos pra zerar. Marque os que terminou." />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0f0d16" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Games" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-fx" id="bgFx" aria-hidden="true"></div>
  <header class="top">
    <div class="top-row">
      <h1>Meus Jogos</h1>
      <button id="resetBtn" class="reset" title="Zerar progresso">limpar</button>
    </div>

    <div class="stats">
      <div class="ring" id="ring">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
          <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="ring-label"><b id="doneCount">0</b><span>/ <span id="totalCount">0</span></span></div>
      </div>
      <div class="stat-lines">
        <div class="stat-main"><b id="pct">0%</b> concluído</div>
        <div class="stat-sub" id="hoursLine">0 h zeradas · 0 h restando</div>
        <div class="bar"><i id="bar"></i></div>
      </div>
    </div>

    <div class="filters" id="filters">
      <button class="chip is-active" data-filter="all">Todos</button>
      <button class="chip" data-filter="playing">Em andamento</button>
      <button class="chip" data-filter="done">Zerados</button>
      <button class="chip chip-re" data-filter="re">RESIDENT EVIL</button>
      <button class="chip chip-buy" data-filter="buy">🛒 COMPRAR</button>
    </div>
  </header>

  <main>
    <section class="shelf" id="shelf">
      <div class="shelf-head"><span class="dot-live"></span> EM ANDAMENTO</div>
      <div class="shelf-row" id="shelfRow"></div>
      <p class="shelf-empty" id="shelfEmpty">segure e arraste um jogo pra cá 🎮</p>
    </section>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>Nada aqui 👀</p>
  </main>

  <footer class="foot">salvo neste dispositivo · funciona offline</footer>

  <button id="fabAdd" class="fab" type="button" aria-label="Adicionar jogo">
    <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
  </button>

  <div id="addOverlay" class="modal-overlay" hidden>
    <form id="addForm" class="modal-card">
      <h2>Adicionar jogo</h2>

      <label class="field">
        <span>Nome do jogo *</span>
        <input type="text" id="addTitle" placeholder="Ex: Elden Ring" required maxlength="80" />
      </label>

      <label class="field">
        <span>Foto</span>
        <input type="file" id="addPhoto" accept="image/*" capture="environment" />
        <div class="photo-preview" id="addPreview" hidden><img alt="" /></div>
      </label>

      <label class="field">
        <span>Adicionar em</span>
        <select id="addCategory">
          <option value="main">Lista principal (Todos)</option>
          <option value="re">Coleção Resident Evil</option>
          <option value="buy">Lista de compras</option>
        </select>
      </label>

      <label class="field" id="fieldHours">
        <span>Duração estimada (opcional)</span>
        <input type="text" id="addNote" placeholder="Ex: ~10-12h" maxlength="20" />
      </label>

      <label class="field" id="fieldPrice" hidden>
        <span>Preço em R$ (opcional)</span>
        <input type="text" inputmode="decimal" id="addPrice" placeholder="Ex: 199,90" />
      </label>

      <div class="modal-actions">
        <button type="button" id="addCancel" class="btn-modal-cancel">Cancelar</button>
        <button type="submit" class="btn-modal-save">Adicionar</button>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
